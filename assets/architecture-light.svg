<rect x="437" y="408" width="190" height="66" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="449.0" y="430.0" fill="#0b0b0b" font-size="12.5" text-anchor="start" font-weight="600">Verify forward</text>
<text x="449.0" y="448.0" fill="#52514e" font-size="11" text-anchor="start" font-weight="400">persistent expert kernel:</text>
<text x="449.0" y="463.0" fill="#52514e" font-size="11" text-anchor="start" font-weight="400">1 launch, weights read once</text>
<path d="M425.0,441.0 h9 m-4,-4 l4,4 l-4,4" stroke="#898781" stroke-width="1.5" fill="none"/>
<rect x="641" y="408" width="190" height="66" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="653.0" y="430.0" fill="#0b0b0b" font-size="12.5" text-anchor="start" font-weight="600">Commit</text>
<text x="653.0" y="448.0" fill="#52514e" font-size="11" text-anchor="start" font-weight="400">stock greedy accept; draft</text>
<text x="653.0" y="463.0" fill="#52514e" font-size="11" text-anchor="start" font-weight="400">KV commit in verify graph</text>
<path d="M629.0,441.0 h9 m-4,-4 l4,4 l-4,4" stroke="#898781" stroke-width="1.5" fill="none"/>
<rect x="29" y="499" width="20" height="14" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="57.0" y="510.0" fill="#52514e" font-size="12" text-anchor="start" font-weight="400">changed or added by the patch</text>
<rect x="261.7" y="499" width="20" height="14" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="289.7" y="510.0" fill="#52514e" font-size="12" text-anchor="start" font-weight="400">stock feature turned on by a launch flag</text>
<rect x="563.7" y="499" width="20" height="14" rx="4" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="591.7" y="510.0" fill="#52514e" font-size="12" text-anchor="start" font-weight="400">stock, unchanged</text>
<text x="29.0" y="532.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">Outputs stay within the judge's agreement bounds; routing is exact top-k and no model work is skipped.</text>
